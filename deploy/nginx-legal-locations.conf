# Include inside the existing HTTPS server block for your hostname.
# Install the three HTML files under /var/www/ig-reply-bot-legal/ first.
# Exact locations take precedence over the existing /ig/ proxy and leave the
# rest of the website (currently disabled) untouched.
location = /ig/privacy {
    alias /var/www/ig-reply-bot-legal/privacy.html;
    default_type text/html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
}

location = /ig/tos {
    alias /var/www/ig-reply-bot-legal/terms.html;
    default_type text/html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
}

location = /ig/data-deletion {
    alias /var/www/ig-reply-bot-legal/data-deletion.html;
    default_type text/html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
}
